<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Descargador de Videos y Audio</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Poppins', sans-serif; }
  .bg-gradient-custom {
    background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #db2777 100%);
  }
  .spinner {
    border: 3px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body class="bg-gradient-custom min-h-screen flex items-center justify-center p-4">

  <div class="bg-white/95 backdrop-blur shadow-2xl rounded-3xl w-full max-w-lg p-8 sm:p-10">

    <div class="text-center mb-8">
      <div class="text-5xl mb-3">📥</div>
      <h1 class="text-2xl sm:text-3xl font-extrabold text-gray-800">Descargador de Videos</h1>
      <p class="text-gray-500 mt-2 text-sm sm:text-base">Pega el enlace de YouTube o Facebook y descarga en segundos</p>
    </div>

    <div class="mb-5">
      <label class="block text-gray-700 font-semibold mb-2 text-sm">Enlace del video</label>
      <input
        id="urlInput"
        type="text"
        placeholder="https://www.youtube.com/watch?v=..."
        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-gray-700"
      />
    </div>

    <div class="mb-6">
      <label class="block text-gray-700 font-semibold mb-2 text-sm">Formato de descarga</label>
      <div class="grid grid-cols-2 gap-3">
        <button type="button" data-formato="mp4" class="formato-btn selected px-4 py-3 rounded-xl border-2 font-semibold transition text-sm sm:text-base">
          🎥 Video MP4
        </button>
        <button type="button" data-formato="mp3" class="formato-btn px-4 py-3 rounded-xl border-2 font-semibold transition text-sm sm:text-base">
          🎵 Audio MP3
        </button>
      </div>
    </div>

    <button
      id="descargarBtn"
      class="w-full bg-gradient-custom text-white font-bold py-3.5 rounded-xl shadow-lg hover:shadow-xl hover:opacity-90 transition flex items-center justify-center gap-2"
    >
      <span id="btnTexto">⬇️ Descargar</span>
    </button>

    <p id="mensaje" class="text-center text-sm mt-4 hidden"></p>

    <p class="text-center text-xs text-gray-400 mt-8">
      Uso personal. Respeta los derechos de autor del contenido que descargues.
    </p>
  </div>

<script>
  let formatoSeleccionado = "mp4";

  document.querySelectorAll(".formato-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".formato-btn").forEach(b => {
        b.classList.remove("selected", "border-indigo-600", "bg-indigo-50", "text-indigo-700");
        b.classList.add("border-gray-200", "text-gray-600");
      });
      btn.classList.add("selected", "border-indigo-600", "bg-indigo-50", "text-indigo-700");
      btn.classList.remove("border-gray-200", "text-gray-600");
      formatoSeleccionado = btn.dataset.formato;
    });
  });

  // Estilo inicial del botón seleccionado por defecto
  document.querySelector('.formato-btn[data-formato="mp4"]').classList.add("border-indigo-600", "bg-indigo-50", "text-indigo-700");
  document.querySelectorAll('.formato-btn:not([data-formato="mp4"])').forEach(b => b.classList.add("border-gray-200", "text-gray-600"));

  const btn = document.getElementById("descargarBtn");
  const btnTexto = document.getElementById("btnTexto");
  const mensaje = document.getElementById("mensaje");
  const urlInput = document.getElementById("urlInput");

  function mostrarMensaje(texto, tipo) {
    mensaje.textContent = texto;
    mensaje.className = "text-center text-sm mt-4 " + (tipo === "error" ? "text-red-600" : "text-green-600");
  }

  btn.addEventListener("click", async () => {
    const url = urlInput.value.trim();
    if (!url) {
      mostrarMensaje("Por favor pega un enlace válido.", "error");
      return;
    }

    btn.disabled = true;
    btnTexto.innerHTML = '<span class="spinner inline-block align-middle mr-2"></span> Descargando...';
    mensaje.classList.add("hidden");

    try {
      const res = await fetch("/api/descargar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url, formato: formatoSeleccionado }),
      });

      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.error || "Ocurrió un error al descargar.");
      }

      const disposicion = res.headers.get("Content-Disposition") || "";
      const match = disposicion.match(/filename="?([^"]+)"?/);
      const nombreArchivo = match ? match[1] : `descarga.${formatoSeleccionado}`;

      const blob = await res.blob();
      const enlace = document.createElement("a");
      enlace.href = URL.createObjectURL(blob);
      enlace.download = nombreArchivo;
      document.body.appendChild(enlace);
      enlace.click();
      enlace.remove();

      mostrarMensaje("¡Descarga completada! 🎉", "ok");
    } catch (err) {
      mostrarMensaje(err.message, "error");
    } finally {
      btn.disabled = false;
      btnTexto.textContent = "⬇️ Descargar";
    }
  });
</script>
</body>
</html>
